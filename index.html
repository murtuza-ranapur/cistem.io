<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cistem.io</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-entry" viewBox="0 0 24 24"><rect x="2" y="4" width="14" height="10" rx="1.5"/><path d="M6 18h6M9 14v4"/><rect x="15" y="9" width="7" height="12" rx="1.5"/><path d="M17.5 19h2"/></symbol>
  <symbol id="ic-lb" viewBox="0 0 24 24"><circle cx="6" cy="12" r="3"/><circle cx="19" cy="5" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="19" cy="19" r="2"/><path d="M9 11l8-5M9 12h8M9 13l8 5"/></symbol>
  <symbol id="ic-service" viewBox="0 0 24 24"><path d="M12 2.5l8 4.6v9.8l-8 4.6-8-4.6V7.1z"/><path d="M8.5 12h7M12 8.5v7"/></symbol>
  <symbol id="ic-cache" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4.5" rx="1.5"/><rect x="3" y="10" width="18" height="4.5" rx="1.5"/><rect x="3" y="16" width="18" height="4.5" rx="1.5"/><path d="M6.5 6.2h.01M6.5 12.2h.01M6.5 18.2h.01" stroke-width="2.4"/></symbol>
  <symbol id="ic-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
  <symbol id="ic-queue" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/><path d="M8 4v4M14 4v4M6 10v4M16 10v4M11 16v4M18 16v4"/></symbol>
  <symbol id="ic-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="ic-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
  <symbol id="ic-organise" viewBox="0 0 24 24"><rect x="3" y="9" width="5" height="6" rx="1"/><rect x="16" y="3" width="5" height="6" rx="1"/><rect x="16" y="15" width="5" height="6" rx="1"/><path d="M8 12h4M12 12V6h4M12 12v6h4"/></symbol>
  <symbol id="ic-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="ic-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="ic-save" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></symbol>
  <symbol id="ic-container" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2" stroke-dasharray="3 2"/><path d="M3 9h18M7 5V3M11 5V3"/></symbol>
  <symbol id="ic-expand" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M9 10v10M9 14h11"/></symbol>
  <symbol id="ic-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="ic-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6"/></symbol>
  <symbol id="ic-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></symbol>
  <symbol id="ic-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"/></symbol>
  <symbol id="ic-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="ic-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
  <symbol id="ic-example" viewBox="0 0 24 24"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></symbol>
</svg>

<div id="app">
  <header id="top">
    <button class="icon" id="drawerBtn" title="Diagrams" aria-label="Diagrams"><svg><use href="#ic-menu"/></svg></button>
    <div class="brand"><span class="logo"></span>cistem<span class="tld">.io</span></div>
    <input id="title" class="title" type="text" aria-label="Diagram title" placeholder="Untitled system">
    <label class="target">Target <input id="rps" type="number" min="1" step="100" value="5000" aria-label="Target requests per second"><span class="unit">rps</span></label>
    <input id="rpsRange" type="range" min="100" max="50000" step="100" value="5000" aria-label="Target requests per second slider">
    <button class="sync" id="sync" title=""><span class="sdot"></span><span id="syncText">local</span></button>
    <div class="verdict" id="verdictWrap"><span class="dot"></span><span id="verdict">—</span><span id="lat" class="lat"></span></div>
    <div class="actions">
      <button class="icon" id="undoBtn" title="Undo (⌘Z)" aria-label="Undo"><svg><use href="#ic-undo"/></svg></button>
      <button class="icon" id="redoBtn" title="Redo (⌘⇧Z)" aria-label="Redo"><svg><use href="#ic-redo"/></svg></button>
      <span class="sep"></span>
      <button class="icon" id="layoutBtn" title="Auto-organise (O)" aria-label="Auto-organise"><svg><use href="#ic-organise"/></svg></button>
      <button class="icon" id="zfit" title="Fit to view (⌘0)" aria-label="Fit to view"><svg><use href="#ic-fit"/></svg></button>
      <button class="icon" id="panelBtn" title="Details panel (I)" aria-label="Toggle details panel"><svg><use href="#ic-panel"/></svg></button>
      <button class="icon" id="expandAll" title="Expand all schemas (⇧Space)" aria-label="Expand all"><svg><use href="#ic-expand"/></svg></button>
      <span class="sep"></span>
      <button class="icon" id="shareBtn" title="Share link" aria-label="Share"><svg><use href="#ic-share"/></svg></button>
      <button class="icon" id="ioBtn" title="Export / import JSON" aria-label="Export or import"><svg><use href="#ic-save"/></svg></button>
      <span class="sep"></span>
      <button id="signInBtn" class="signin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.5 2 2 6.6 2 12.3c0 4.5 2.9 8.4 6.8 9.7.5.1.7-.2.7-.5v-1.9c-2.8.6-3.4-1.2-3.4-1.2-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5.1 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 4-2.4 4.8-4.6 5.1.4.3.7 1 .7 1.9v2.8c0 .3.2.6.7.5A10.2 10.2 0 0 0 22 12.3C22 6.6 17.5 2 12 2z"/></svg>Sign in with GitHub</button>
      <button id="accountBtn" class="account" hidden aria-label="Account"><img id="avatar" alt="" width="24" height="24"><span id="login"></span></button>
      <div id="accountMenu" class="menu" hidden><div class="menu-head" id="accountName"></div><button id="signOutBtn" class="menu-item">Sign out</button></div>
      <button class="icon" id="resetBtn" title="Open the example (as a new diagram)" aria-label="Open example"><svg><use href="#ic-example"/></svg></button>
    </div>
  </header>

  <aside id="rail" aria-label="Components">
    <button class="comp k-entry" data-add="entry" draggable="true" title="Clients"><svg><use href="#ic-entry"/></svg><span>Clients</span></button>
    <button class="comp k-lb" data-add="lb" draggable="true" title="Load balancer"><svg><use href="#ic-lb"/></svg><span>LB</span></button>
    <button class="comp k-service" data-add="service" draggable="true" title="Microservice"><svg><use href="#ic-service"/></svg><span>Service</span></button>
    <button class="comp k-cache" data-add="cache" draggable="true" title="Redis"><svg><use href="#ic-cache"/></svg><span>Redis</span></button>
    <button class="comp k-db" data-add="db" draggable="true" title="Postgres"><svg><use href="#ic-db"/></svg><span>Postgres</span></button>
    <button class="comp k-queue" data-add="queue" draggable="true" title="Kafka"><svg><use href="#ic-queue"/></svg><span>Kafka</span></button>
    <div class="rail-sep"></div>
    <button class="comp k-container" data-add-container="1" title="Environment (container)"><svg><use href="#ic-container"/></svg><span>Env</span></button>
    <div class="rail-hint">drag onto canvas</div>
  </aside>

  <main id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="0.9" fill="var(--grid)"/></pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker>
        <marker id="arrowCrit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--crit)"/></marker>
        <marker id="arrowSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--sel)"/></marker>
        <marker id="crow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L11 6L1 11M1 6H11" fill="none" stroke="var(--fk)" stroke-width="1.3"/></marker>
        <filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/></filter>
      </defs>
      <rect x="-100000" y="-100000" width="200000" height="200000" fill="url(#grid)"/>
      <g id="world"><g id="frames"></g><g id="edges"></g><g id="nodes"></g><g id="fks"></g><g id="labels"></g><g id="overlay"></g></g>
    </svg>
    <div id="hint" hidden></div>
    <div id="emptyState" hidden><strong>Blank canvas</strong><span>Drag a component in from the left, or load the example.</span></div>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><span id="zoomPct">100%</span><button id="zout" aria-label="Zoom out">−</button></div>
    <input id="renameBox" type="text" hidden aria-label="Rename">
  </main>

  <aside id="inspector" class="closed" aria-label="Details">
    <div id="inspBar"><span>Details</span><span class="spacer"></span><button class="icon" data-panel="pin" aria-label="Pin panel"><svg><use href="#ic-pin"/></svg></button><button class="icon" data-panel="close" title="Hide panel (I)" aria-label="Hide panel"><svg><use href="#ic-close"/></svg></button></div>
    <div id="sheetBody"></div>
  </aside>

  <aside id="drawer" hidden aria-label="Diagrams">
    <div class="dhead"><strong>Diagrams</strong><span class="spacer"></span><button class="small primary" id="newDiagram">+ New</button><button class="icon" id="drawerClose" aria-label="Close">×</button></div>
    <div id="drawerList"></div>
    <div class="dfoot"><button class="small" id="saveAsNew">Save current as new</button></div>
  </aside>

  <div id="conflict" class="banner" hidden>
    <span>This diagram was changed elsewhere.</span>
    <button class="small" id="conflictTheirs">Load theirs</button>
    <button class="small primary" id="conflictMine">Keep mine</button>
  </div>
  <div id="toast" class="banner" hidden></div>


  <div id="io" class="modal" hidden>
    <div class="io-card">
      <div class="io-head"><strong>Diagram JSON</strong><button class="icon" id="ioClose" aria-label="Close">×</button></div>
      <textarea id="json" aria-label="Diagram JSON" spellcheck="false"></textarea>
      <div class="io-row"><button id="copyJson">Copy</button><button id="loadJson" class="primary">Load from text</button><span class="muted" id="ioMsg"></span></div>
    </div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
