<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loadmap</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-entry" viewBox="0 0 24 24"><rect x="2" y="4" width="14" height="10" rx="1.5"/><path d="M6 18h6M9 14v4"/><rect x="15" y="9" width="7" height="12" rx="1.5"/><path d="M17.5 19h2"/></symbol>
  <symbol id="ic-lb" viewBox="0 0 24 24"><circle cx="6" cy="12" r="3"/><circle cx="19" cy="5" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="19" cy="19" r="2"/><path d="M9 11l8-5M9 12h8M9 13l8 5"/></symbol>
  <symbol id="ic-service" viewBox="0 0 24 24"><path d="M12 2.5l8 4.6v9.8l-8 4.6-8-4.6V7.1z"/><path d="M8.5 12h7M12 8.5v7"/></symbol>
  <symbol id="ic-cache" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4.5" rx="1.5"/><rect x="3" y="10" width="18" height="4.5" rx="1.5"/><rect x="3" y="16" width="18" height="4.5" rx="1.5"/><path d="M6.5 6.2h.01M6.5 12.2h.01M6.5 18.2h.01" stroke-width="2.4"/></symbol>
  <symbol id="ic-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
  <symbol id="ic-queue" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/><path d="M8 4v4M14 4v4M6 10v4M16 10v4M11 16v4M18 16v4"/></symbol>
</svg>

<header>
  <h1>Loadmap <span>· system capacity sketch</span></h1>
  <div class="target">target <input id="rps" type="number" min="1" step="100" value="5000" aria-label="Target requests per second"> rps</div>
  <div class="verdict"><span id="verdict" class="pill ok">—</span><span id="lat" class="lat"></span></div>
</header>

<div class="palette" id="palette">
  <button data-add="lb"><svg class="glyph" style="stroke:var(--c-lb);fill:none;stroke-width:1.6"><use href="#ic-lb"/></svg>Load balancer</button>
  <button data-add="service"><svg style="stroke:var(--c-service);fill:none;stroke-width:1.6"><use href="#ic-service"/></svg>Service</button>
  <button data-add="cache"><svg style="stroke:var(--c-cache);fill:none;stroke-width:1.6"><use href="#ic-cache"/></svg>Redis</button>
  <button data-add="db"><svg style="stroke:var(--c-db);fill:none;stroke-width:1.6"><use href="#ic-db"/></svg>Postgres</button>
  <button data-add="queue"><svg style="stroke:var(--c-queue);fill:none;stroke-width:1.6"><use href="#ic-queue"/></svg>Kafka</button>
  <span class="sep"></span>
  <button id="connectBtn">Connect</button>
  <button id="deleteBtn">Delete</button>
  <button id="layoutBtn" title="Auto-organise (o)">Auto-organise</button>
  <span class="sep"></span>
  <button id="ioBtn">Save / load</button>
  <button id="resetBtn">Example</button>
</div>

<div id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--node-line)"/></marker>
      <marker id="arrowCrit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--crit)"/></marker>
      <marker id="arrowSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--sel)"/></marker>
    </defs>
    <rect x="-100000" y="-100000" width="200000" height="200000" fill="url(#grid)"/>
    <g id="world"><g id="edges"></g><g id="nodes"></g></g>
  </svg>
  <div id="hint" hidden></div>
  <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit" style="font-size:11px">fit</button></div>
</div>

<div id="sheet">
  <div id="sheetBody"><p class="empty">Tap a node or edge to edit it. Drag nodes to move, drag empty space to pan, pinch or scroll to zoom.</p></div>
  <div id="io">
    <textarea id="json" aria-label="Diagram JSON"></textarea>
    <div class="row"><button id="copyJson">Copy</button><button id="loadJson" class="primary">Load from text</button><span class="empty" id="ioMsg"></span></div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
