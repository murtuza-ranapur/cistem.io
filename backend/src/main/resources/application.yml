spring:
  application.name: cistem-api
  threads.virtual.enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cistem}
    username: ${PGUSER:cistem}
    password: ${PGPASSWORD:cistem}
  flyway.enabled: true
  jackson.default-property-inclusion: non_null
  session:
    jdbc.initialize-schema: never   # Flyway creates the tables
    timeout: 30d
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope: read:user
  web.resources.cache.cachecontrol.max-age: 1h
  ai.mcp.server:
    name: cistem
    version: 0.2.0
    protocol: STREAMABLE
    type: SYNC
    annotation-scanner.enabled: true
    instructions: >
      cistem.dev stores system-design diagrams whose components have behaviour, and sequence diagrams that
      draw on them. Use list_diagrams to find the user's diagrams (kind: system or sequence). For system
      diagrams, evaluate runs the capacity model and the add/connect/set tools change the design; every edit
      returns a fresh evaluation. For sequences, get_sequence / set_sequence / create_sequence work with a
      short text format (a -> b: call, b --> a: reply, a ->> q: async, alt/opt/loop/par ... end).
      Class diagrams: create_class_diagram / set_class_diagram take classes and relations as JSON.
    capabilities:
      tool: true
      resource: true
      prompt: false
      completion: false

server:
  port: ${PORT:8080}
  compression.enabled: true
  forward-headers-strategy: framework   # Railway terminates TLS; trust X-Forwarded-*
  servlet.session.cookie:
    name: cistem_session
    http-only: true
    same-site: lax
    secure: ${COOKIE_SECURE:true}

cistem:
  public-url: ${CISTEM_PUBLIC_URL:http://localhost:8080}
  api-key: ${CISTEM_API_KEY:}
  allowed-origins: ${CISTEM_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
